<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body bgcolor="cyan">
    <h1>Registration Form</h1>
    <form action="#" methods="post">
        <fieldset>
        <label>Student Name</label>
        <input type="text" placeholder="Enter your Name">
        <br><br>
        <label>Email:</label>
        <input type="text" placeholder="Enter your Email">
        <br><br>
        <label>Password</label>
        <input type="text" placeholder="Enter your Password">
        </fieldset>
        <br><br>
        <label>Age</label>
        <input type="text" placeholder="Enter your Age" min="18" max="50">
        <br><br>
        <label>Gender:</label>
        <input type="radio"
               value="Male">Male
        <input type="radio"
               value="Female">Female


    </form>
    
</body>
</html>
